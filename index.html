<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market & Kalitlar do'koni</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">
      <i class="fa-solid fa-store"></i> Market Platform
    </div>

    <div class="user-auth-zone">
      <div id="navCoins" class="coins-badge hidden">
        <i class="fa-solid fa-coins"></i> <span id="userCoinsCount">0</span>
      </div>
      
      <div id="navUsername" class="user-display">
        <i class="fa-solid fa-circle-user"></i> Mehmonda
      </div>

      <button id="openAuthModalBtn" class="btn btn-primary">Kirish</button>
      <button id="logoutBtn" class="btn btn-danger hidden">Chiqish</button>
    </div>
  </nav>

  <!-- NAV TABS -->
  <div class="nav-links">
    <button id="tabMarketBtn" class="nav-btn active"><i class="fa-solid fa-shop"></i> Bozor</button>
    <button id="tabKeysBtn" class="nav-btn"><i class="fa-solid fa-key"></i> Kalitlar</button>
    <button id="tabAddBtn" class="nav-btn"><i class="fa-solid fa-plus-circle"></i> Qo'shish</button>
    <button id="tabProfileBtn" class="nav-btn"><i class="fa-solid fa-user-gear"></i> Profil</button>
  </div>

  <div class="container">

    <!-- 1. BOZOR BO'LIMI -->
    <section id="marketSection" class="tab-content active">
      <h2 class="section-header">Oddiy mahsulotlar</h2>
      <div id="marketGrid" class="cards-grid"></div>
    </section>

    <!-- 2. KALITLAR BO'LIMI -->
    <section id="keysSection" class="tab-content">
      <h2 class="section-header">Koin evaziga kalitlar</h2>
      <div id="keysGrid" class="cards-grid"></div>
    </section>

    <!-- 3. QO'SHISH BO'LIMI -->
    <section id="addSection" class="tab-content">
      <div class="form-card">
        <h2>Yangi e'lon qo'shish</h2>
        <form id="sellForm">
          <div class="form-group">
            <label>Kategoriya</label>
            <select id="prodCategory">
              <option value="key">Kalit (Koin bilan sotish)</option>
              <option value="normal">Oddiy mahsulot (Parol bilan)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Nomi</label>
            <input type="text" id="prodTitle" required placeholder="Masalan: Telegram Premium Kalit">
          </div>
          <div id="priceGroup" class="form-group">
            <label>Narxi (Koinlarda)</label>
            <input type="number" id="prodPrice" value="50" min="0">
          </div>
          <div class="form-group">
            <label>Rasm URL (ixtiyoriy)</label>
            <input type="text" id="prodImgUrl" placeholder="https://...">
          </div>
          <div class="form-group">
            <label>Tavsif (Tushuntirish)</label>
            <textarea id="prodDesc" rows="3" required></textarea>
          </div>
          <div class="form-group secret-group">
            <label>Sirlar (Kalit/Havola/Kodni yozing)</label>
            <textarea id="prodSecretData" rows="2" required placeholder="Faqat sotib olgan kishi ko'radi"></textarea>
          </div>
          <div id="passGroup" class="form-group hidden">
            <label>Ochish paroli (Oddiy mahsulot uchun)</label>
            <input type="text" id="prodSecretPassword" placeholder="Parol yozing">
          </div>
          <button type="submit" class="btn btn-primary btn-block">E'lonni joylash</button>
        </form>
      </div>
    </section>

    <!-- 4. PROFIL VA ADMIN PANEL -->
    <section id="profileSection" class="tab-content">
      <div class="profile-card">
        <h2>Foydalanuvchi Profili</h2>
        <p>Login: <b id="profName">...</b></p>
        <p>Hisobdagi Koinlar: <b id="profBalance">0</b></p>
        <hr style="margin: 15px 0; border-color:#334155;">

        <!-- SAYT EGASI ADMIN PANELI -->
        <div id="adminPanel" class="admin-panel hidden">
          <h3><i class="fa-solid fa-crown"></i> Sayt Egasi Paneli (Koin berish)</h3>
          <div id="userRolesList"></div>
        </div>

        <h3>Mening e'lonlarim</h3>
        <div id="myProductsGrid" class="cards-grid" style="margin-top:10px;"></div>
      </div>
    </section>

  </div>

  <!-- AUTH MODAL (Kirish / Registratsiya) -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <span id="closeAuthModal" class="close-modal">&times;</span>
      
      <div class="modal-tabs">
        <button id="showLoginBtn" class="modal-tab-btn active">Kirish</button>
        <button id="showRegisterBtn" class="modal-tab-btn">Ro'yxatdan o'tish</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form active">
        <div class="form-group">
          <label>Login</label>
          <input type="text" id="loginUser" required>
        </div>
        <div class="form-group">
          <label>Parol</label>
          <input type="password" id="loginPass" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Kirish</button>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label>Yangi Login</label>
          <input type="text" id="regUser" required>
        </div>
        <div class="form-group">
          <label>Yangi Parol</label>
          <input type="password" id="regPass" required>
        </div>
        <button type="submit" class="btn btn-warning btn-block">Ro'yxatdan o'tish</button>
      </form>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
