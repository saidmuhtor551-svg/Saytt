<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Современная страница</title>
  <!-- Подключение CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Шапка сайта -->
  <header class="header">
    <div class="container header__container">
      <a href="#" class="header__logo">Logo</a>
      <nav class="header__nav nav">
        <ul class="nav__list">
          <li class="nav__item"><a href="#home" class="nav__link">Главная</a></li>
          <li class="nav__item"><a href="#about" class="nav__link">О нас</a></li>
          <li class="nav__item"><a href="#services" class="nav__link">Услуги</a></li>
          <li class="nav__item"><a href="#contact" class="nav__link">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Основной контент -->
  <main class="main">
    
    <!-- Hero / Главная секция -->
    <section class="hero">
      <div class="container hero__container">
        <h1 class="hero__title">Заголовок вашей страницы</h1>
        <p class="hero__subtitle">Краткое описание или призыв к действию для пользователей.</p>
        <button class="hero__btn" type="button">Начать</button>
      </div>
    </section>

    <!-- Секция с контентом -->
    <section id="about" class="about">
      <div class="container">
        <h2 class="about__title">О нас</h2>
        <p class="about__text">Здесь располагается основной текст или карточки с информацией.</p>
      </div>
    </section>

  </main>

  <!-- Подвал сайта -->
  <footer class="footer">
    <div class="container footer__container">
      <p class="footer__copy">&copy; 2026 Все права защищены.</p>
    </div>
  </footer>

  <!-- Подключение JS (если нужен) -->
  <script src="main.js"></script>
</body>
</html>
